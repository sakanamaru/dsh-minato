name: build-release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main          # M-8：main 推送跑测试 job（build/release job 仅 tag/手动触发）
      - 'v3*'         # V3 平行树分支：推送即跑测试 + v3-contracts（Win/Linux 契约测试，切换门槛③）
  pull_request:       # M-8：PR 也跑测试 job
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for zip naming / hashes header; assets attach ONLY on tag builds (immutable-release flow); empty = build only'
        required: false
        default: ''

# 最小权限：test 只读；build 才需要写（回推 hashes.txt / 上传 draft release 资产 / 签发 attestation）
jobs:
  test:
    name: unit + integration tests
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2，固定 commit SHA（供应链：不跟浮动 tag）

      - name: Build & run unit tests (same-assembly, /define:UNIT)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $src = @("$PWD\v2\dsh_v2.cs") + (Get-ChildItem "$PWD\v2\src" -Recurse -Filter *.cs | ForEach-Object FullName)
          & $csc /nologo /target:exe /define:UNIT /out:unittests.exe $src "$PWD\v2\tests\unit_tests.cs" /warn:4
          if ($LASTEXITCODE -ne 0) { throw "unit test build failed" }
          .\unittests.exe
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed" }

      - name: dotnet build (v2.8 stage 2 — SDK-style core project, net8.0) — guard only
        shell: pwsh
        run: |
          dotnet --list-sdks
          dotnet build v2/DeepSeekHarnessToolkit.Core.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed (stage 2 core project)" }
          Get-Item "v2\bin\Release\net8.0\DeepSeek Harness Toolkit.dll" | Select-Object Name,Length
      - name: Compile GUI variants (attached + standalone) — regression guard only
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $src = @("$PWD\v2\dsh_v2.cs") + (Get-ChildItem "$PWD\v2\src" -Recurse -Filter *.cs | ForEach-Object FullName)
          & $csc /nologo /optimize+ /target:exe /win32icon:icon.ico /out:core_check.exe $src /warn:4
          if ($LASTEXITCODE -ne 0) { throw "core compile failed (guard)" }
          & $csc /nologo /optimize+ /target:winexe /win32icon:icon.ico "/win32manifest:$PWD\v2\app.manifest" /resource:logo.png /out:gui_check.exe "$PWD\v2\gui_v2.cs" /warn:4
          if ($LASTEXITCODE -ne 0) { throw "GUI (attached) compile failed" }
          & $csc /nologo /optimize+ /target:winexe /win32icon:icon.ico "/win32manifest:$PWD\v2\app.manifest" /resource:logo.png /resource:core_check.exe,DSHCore.exe /out:gui_standalone_check.exe "$PWD\v2\gui_v2.cs" /warn:4
          if ($LASTEXITCODE -ne 0) { throw "GUI (standalone) compile failed" }
          Remove-Item core_check.exe, gui_check.exe, gui_standalone_check.exe -ErrorAction SilentlyContinue
          Write-Output "GUI variants compile clean (/warn:4, embedded logo + core)"
      - name: GUI logic tests (signals / markers / settings cards / i18n enforcement)
        shell: pwsh
        run: |
          # 与 gui_v2.cs 同程序集编译；/main: 指定测试入口（gui_v2.cs 自带 WinForms 入口）
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /main:GuiLogicTests /out:guilogictests.exe "$PWD\v2\gui_v2.cs" "$PWD\v2\tests\gui_logic_tests.cs" /warn:4
          if ($LASTEXITCODE -ne 0) { throw "GUI logic test build failed" }
          .\guilogictests.exe
          if ($LASTEXITCODE -ne 0) { throw "GUI logic tests failed" }
          Remove-Item guilogictests.exe -ErrorAction SilentlyContinue

      - name: Run integration tests (stubbed matrix, no real ~/.dsh touched)
        shell: pwsh
        run: |
          .\v2\tests\integration.ps1 -RepoRoot (Join-Path (Get-Location).Path 'v2')
          if ($LASTEXITCODE -ne 0) { throw "integration tests failed" }

  v3-contracts:
    name: V3 contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build V3 CLI (net8.0)
        shell: pwsh
        run: dotnet build v3/src/Dsht.Cli/Dsht.Cli.csproj -c Release --nologo
      - name: Run V3 contract tests
        shell: pwsh
        run: dotnet run --project v3/tests/Dsht.Contracts.Tests/Dsht.Contracts.Tests.csproj -c Release
      - name: Build cross-platform GUI skeleton (Avalonia)
        shell: pwsh
        run: dotnet build v3/gui/Dsht.Gui.Avalonia/Dsht.Gui.Avalonia.csproj -c Release --nologo
      - name: Run GUI logic tests (marker parsing)
        shell: pwsh
        run: dotnet run --project v3/gui/Dsht.Gui.LogicTests -c Release

  # ---------------------------------------------------------------------------
  # 批次 E4（2026-10-07）：「命令 × 隔离数据根」冒烟矩阵 + 真实恢复端到端。
  #
  # 为什么单独一个 job（而不是往 v3-contracts 里塞步骤）：
  #   ① 有选择的接：这一批只接**能在干净 runner 上无人值守跑通**的检查 ✓
  #      13 项本地门槛**不接** ✗ —— 其中一部分依赖本机状态（服务在跑）或联网，
  #      接进来只会制造**假红**（真红了没人看，比不接更糟 ✗✓）
  #   ② 不改变任何现有 job 的语义 ✓（只新增 job ✓）
  #
  # 这个 job 补的是**本仓库最大的那个洞**：门槛一直在证明"能编译、契约测试通过"，
  #   却从没有一次运行去**真的执行一条对外宣传的命令** —— 于是
  #   `backup-export` 的成功路径一次都没被跑过，缺陷一路活到 3.0.6 ✗✗
  #   （来源：《施工规格-2026-10-07-批次E-回路与CI.md》E4c / 外部审查建议 §2.2）
  #
  # ⚠ 关于 shell 脚本：`v3/tools/linux_smoke.sh` 与 `v3/tools/verify_backup_chain.sh`
  #   依赖 POSIX 工具（`mktemp -d /tmp`、`timeout`、`ss`、`stat -c`、可执行位）✗
  #   → **只在 ubuntu runner 上有意义** ✓ 它们由既有的 `v3-linux` job（ubuntu-latest）
  #     执行 ✓ 这里**不**在 Windows 上假装跑它们 ✓（那只会制造假红 ✗）
  # ---------------------------------------------------------------------------
  v3-smoke-matrix:
    name: V3 command smoke matrix (isolated roots)
    needs: v3-contracts
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2，固定 commit SHA（供应链：不跟浮动 tag）
      - name: Build V3 CLI (net8.0)
        shell: pwsh
        run: dotnet build v3/src/Dsht.Cli/Dsht.Cli.csproj -c Release --nologo
      # ★ 本轮 E4c：逐个对外宣传的命令在**隔离 DSH_HOME** 里真跑 → 断言标记行 + 退出码 ✓
      #   默认就是**严格模式**（`-AllowKnownDefect` 不传 = $false）✓：A1/D1 已修复，
      #   所以这里**不允许**它再退化成 XFAIL ✓ —— export 一失败这个 job 就红 ✓✓
      - name: Command x isolated-data-root smoke matrix
        shell: pwsh
        run: pwsh -NoProfile -File v3/tests/verify_command_matrix.ps1 -Repo .
      # ★ 本轮 E4b：真实恢复（隔离根 + 真实写盘 + 零越界）—— 全 PowerShell，windows 可跑 ✓
      - name: Real restore end-to-end (isolated root, --apply)
        shell: pwsh
        run: pwsh -NoProfile -File v3/tests/verify_restore_apply.ps1 -Repo .
      # ★ 本轮 E4a 的落点：GUI 构建设 0 错误由 v3-contracts 的
      #   "Build cross-platform GUI skeleton (Avalonia)" 步骤负责 ✓
      #   （历史上 13 项门槛**不建** Avalonia GUI ✗ → 提交过编译不过的 GUI ✓）
      - name: Build the Avalonia GUI explicitly (13-gate blind spot)
        shell: pwsh
        run: dotnet build v3/gui/Dsht.Gui.Avalonia/Dsht.Gui.Avalonia.csproj -c Release --nologo
  # V3 Linux package job: the CI used to only build on ubuntu and never publish or upload anything.
  # Depends on v3-contracts only; the v2.x release chain locked by verify_switchover is untouched.
  # No new actions: ubuntu-latest ships .NET 8, and artifacts go up with the preinstalled gh CLI.
  v3-linux:
    name: V3 Linux package (linux-x64)
    needs: v3-contracts
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/v3-linux'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write        # artifact attestation (OIDC)
      attestations: write    # release provenance
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 fixed SHA
      - name: Publish V3 CLI (small, framework-dependent)
        run: dotnet publish v3/src/Dsht.Cli/Dsht.Cli.csproj -c Release -r linux-x64 --self-contained false -o out/fd --nologo
      - name: Publish V3 CLI (self-contained single file)
        run: dotnet publish v3/src/Dsht.Cli/Dsht.Cli.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o out/sc --nologo
      - name: Publish Avalonia GUI (self-contained)
        run: dotnet publish v3/gui/Dsht.Gui.Avalonia/Dsht.Gui.Avalonia.csproj -c Release -r linux-x64 --self-contained true -o out/gui --nologo
      - name: Smoke test the published CLI (read-only, isolated root, never the default port)
        run: |
          chmod +x out/sc/dsh-minato
          bash v3/tools/linux_smoke.sh out/sc/dsh-minato
          bash v3/tools/linux_paths_check.sh out/sc/dsh-minato
      - name: Verify the backup trust chain (isolated roots, never the default port)
        run: |
          chmod +x out/sc/dsh-minato
          bash v3/tools/verify_backup_chain.sh out/sc/dsh-minato
      - name: Verify the failure paths (read-only targets, concurrency)
        run: |
          chmod +x out/sc/dsh-minato
          bash v3/tools/verify_failure_paths.sh out/sc/dsh-minato
      - name: Assemble the Linux package
        run: |
          set -e
          PKG=dsh-minato-linux-x64
          rm -rf "$PKG" && mkdir -p "$PKG/cli-small" "$PKG/gui" "$PKG/icons/hicolor/256x256/apps"
          cp out/sc/dsh-minato "$PKG/dsh-minato"
          cp -r out/fd/. "$PKG/cli-small/"
          cp -r out/gui/. "$PKG/gui/"
          # ★★★ D5 修复（Linux 真机复审 MINOR —— 图标尺寸与目录名不符）✓✓
          #   ✗ 原来固定丢进 `icons/hicolor/256x256/apps/` ✗ —— 而 `logo-icon.png` 实测是 **64×64**
          #     （真机：`file` 报 `PNG image data, 64 x 64` ✓ 见 Linux真机验证-2026-10-07-官方包.md §1.3(c) 观察 1）
          #     → freedesktop 按**目录名**索引图标 ✓ 目录说 256、图是 64 → 缩放假象 ✗（图标看起来糊 ✓）
          #   ✓ 现在：**尺寸由 PNG 头读出来，目录名跟着图片走** ✓✓（不写死 ✗ 不猜 ✗ —— 图换了目录自动跟着换 ✓）
          #     · 只改**确实错**的那一处（目录名）✗ 不改图标本身、不改设计 ✓
          ICONSRC=v3/gui/Dsht.Gui.Avalonia/Assets/logo-icon.png
          ICONWH=$(python3 -c "import struct,sys;d=open(sys.argv[1],'rb').read(24);print('%dx%d'%struct.unpack('>II',d[16:24]))" "$ICONSRC")
          mkdir -p "$PKG/icons/hicolor/$ICONWH/apps"
          cp "$ICONSRC" "$PKG/icons/hicolor/$ICONWH/apps/dsh-minato.png"
          echo "icon: $ICONSRC ($ICONWH) -> icons/hicolor/$ICONWH/apps/dsh-minato.png"
          cp LICENSE "$PKG/" 2>/dev/null || true
          cp README.md "$PKG/" 2>/dev/null || true
          cp v3/tools/linux_smoke.sh "$PKG/"
          # O1 FIX (Linux final review): the package shipped the smoke test but NOT the installer, so a
          # user who unpacked the tarball had no supported way to install or uninstall - the readme told
          # them to copy files by hand. Ship the script the project actually maintains.
          cp v3/tools/install.sh "$PKG/"
          printf "%s\n" "[Desktop Entry]" "Type=Application" "Name=dsh-minato" "Comment=Deploy and ops kit for DeepSeek Harness (dsh)" "Exec=dsh-minato" "Icon=dsh-minato" "Terminal=true" "Categories=Utility;" > "$PKG/dsh-minato.desktop"
          printf "%s\n" "install: ./install.sh            (adds a command link; --prefix <dir> to choose where)" "uninstall: ./install.sh --uninstall" "gui: ./gui/dsht-gui (self-contained, no .NET needed)" "menu entry: install.sh writes one unless you pass --no-desktop" "runtime deps: iproute2 (ss), ps, and one of curl/wget/python3 plus tar when bootstrapping Node" "known gaps: see docs/LINUX-TEST.md and v3/gui/Dsht.Gui.Avalonia/README.md" > "$PKG/README-Linux.txt"
                    # audit fix: the execute bit is a property of the file in git; if it is ever lost
          # again the tarball would ship a script the user cannot run (this happened once,
          # found by the first real install on Linux). Set it explicitly at packaging time.
          chmod +x "$PKG/install.sh" 2>/dev/null || true
          find "$PKG" -name '*.sh' -exec chmod +x {} + 2>/dev/null || true
          # ★★★ D4 修复（Linux 真机复审 MINOR —— 打包权限不干净）✓✓
          #   真机观察（Linux真机验证-2026-10-07-官方包.md §1.3(d) 观察 3）：
          #     `gui/Avalonia.DesignerSupport.dll`、`gui/libcoreclr.so`、`gui/createdump` 是 `-rwxr--r--`，
          #     而同类的 `Avalonia.Base.dll` 是 `-rw-r--r--` ✗ → CI runner 构建目录的权限被**原样**打进包 ✓
          #   ✓ 现在：**按"这个文件到底是干什么的"重设权限** ✓✓（不是无脑 chmod -R 644 ✗ —— 会把可执行文件弄坏 ✓）
          #     · 规则一：**动态库**（`*.so` / `*.so.*`）与 `*.dll` → 0644 ✓
          #       （它们是 mmap 加载的 ✓ 不需要执行位 ✓ 且真机里正是这一批误带 744 ✗）
          #     · 规则二：**全包里凡是真的 ELF**（magic `\177ELF`）→ 0755 ✓
          #       · 真可执行（`dsh-minato` / `gui/dsht-gui` / `gui/createdump`）✓
          #       · ⚠ 同时**补回丢掉的执行位**：`dotnet publish` 在 Windows 上产出的 apphost 可能是
          #         `-rw-rw-r--` ✗ → 真机一执行就 `Permission denied` ✗（与 3.0.0 那次"tar 里脚本丢执行位"同类 ✓）
          #         —— 这一步**不依赖"它本来就有执行位"** ✗，所以丢位也能补回来 ✓✓
          #     · 规则三：其余**仍带执行位的普通文件** → `*.sh` 保留 0755 ✓；真的 ELF 也保留 ✓；
          #       其它（`README-Linux.txt` / `hashes.txt` / `LICENSE` / `.desktop` / `*.json` …）→ 0644 ✓
          #     · 扫**全包**（不只 gui/）：真机同一批里 `README-Linux.txt` 也是 `-rwxr--r--` ✓
          #   ★★★ 三条规则**只能作用在普通文件上**（`find -type f`）✓✓ —— 手滑写成不带 `-type f` 的
          #     `find "$PKG" -perm -u+x` 会连**目录**一起 `chmod 644` ✗✗ → 目录丢掉 `x` → **谁也别想进去** ✗
          #     （本轮实测踩到过：`icons/hicolor` 变成 `drw-rw-r--`，连 `rm -rf` 都删不掉 ✓ 已由 `-type f` 挡住 ✓）
          #   ⚠ 必须在**生成 hashes.txt 之前**跑 ✓（权限不进摘要 ✓ 但顺序清楚更好读 ✓）
          find "$PKG" -type f \( -name '*.so' -o -name '*.so.*' -o -name '*.dll' \) -exec chmod 644 {} + 2>/dev/null || true
          for _f in $(find "$PKG" -type f 2>/dev/null); do
            case "$_f" in *.so|*.so.*|*.dll) continue ;; esac
            if head -c 4 "$_f" 2>/dev/null | od -An -c | grep -q '177   E   L   F'; then chmod 755 "$_f"; fi
          done
          for _f in $(find "$PKG" -type f -perm -u+x 2>/dev/null); do
            case "$_f" in
              *.sh) chmod 755 "$_f" ;;
              *)
                if head -c 4 "$_f" 2>/dev/null | od -An -c | grep -q '177   E   L   F'; then chmod 755 "$_f"; else chmod 644 "$_f"; fi
                ;;
            esac
          done
          echo "exec bits: $(find "$PKG" -type f -perm -u+x | wc -l) executable file(s) remain in the package"
          find "$PKG" -type f -perm -u+x | sed 's/^/    exec: /'
          # LINUX-PKG-MANIFEST-FIX: the tarball shipped without hashes.txt, so the installer
          # verified nothing (reported on the first real install on Linux). The Windows payload
          # always carries one and refuses to install without it - this was an asymmetry.
          ( cd "$PKG" && find . -type f ! -name 'hashes.txt' -printf '%P\n' 2>/dev/null | sort | while IFS= read -r f; do
          printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$f"
          done ) > "$PKG/hashes.txt"
          echo "package hashes.txt entries: $(wc -l < "$PKG/hashes.txt")"
          tar -czf "$PKG.tar.gz" "$PKG"
          sha256sum "$PKG.tar.gz" > "$PKG.tar.gz.sha256"
          cat "$PKG.tar.gz.sha256"
      - name: Verify the assembled package with the shell verifier
        run: |
          chmod +x v3/tools/verify-linux.sh
          bash v3/tools/verify-linux.sh dsh-minato-linux-x64.tar.gz dsh-minato-linux-x64.tar.gz.sha256
      # ★★★ T1 / D2 同族修复（2026-10-07 —— 外部审查者点名）✓✓
      #   ✗ 到这一步为止，CI 对 `install.sh` 做过的唯一一件事是 **`cp` + `chmod +x`** ✗
      #     —— `v3/tools/verify-linux.sh` 也**不执行**它 ✓（它只核对资产、跑 `version` / `about` ✓）
      #     → **安装器的退出码从来没有被任何自动化当过判据** ✗✗
      #   → 后果（已经发生过一次 ✓）：`install.sh` 正常安装却 `exit 3`（自检分母把安装器自建文件算进去 ✗）
      #     一路发到 v3.0.7 ✓ 直到有人在**真机**上手动装了一次才发现 ✓
      #     （留档：`docs/修复记录-2026-10-07-D1注释与安装器退出码.md` ✓）
      #   ✓ 现在：**真的装一次、真的卸一次，两次都断言 exit 0** ✓✓
      #     · 装到 `$RUNNER_TEMP/minato-ip`（**临时 prefix** ✓ 不碰 runner 的真实 ~/.local ✓）
      #     · 卸载后再断言 **`$HOME/.dsh` 一个条目都没变**（名字 + mtime 快照前后对照 ✓）
      #       —— 这是安装器**最对外的那条承诺**（"卸载不会删你的数据" ✓）第一次被自动化验证 ✓
      #     · 只**新增**这一步 ✗：不改任何现有 step / job 的语义 ✓
      #     · ⚠ 这是 `run: |` **块内容**：本文件是 CRLF，缩进必须与相邻行一致（**10 空格** ✓）
      #       —— 本仓库刚因为缩进错把 workflow 变成非法 YAML 而门槛仍报绿 ✗（已用真 YAML 解析器核过 ✓）
      - name: Install and uninstall install.sh for real (assert exit 0, leave ~/.dsh untouched)
        run: |
          set -u
          export HOME="$RUNNER_TEMP/minato-ip-home"
          rm -rf "$HOME" "$RUNNER_TEMP/minato-ip" "$RUNNER_TEMP/minato-ip-src"
          mkdir -p "$HOME" "$RUNNER_TEMP/minato-ip-src"
          tar -xzf dsh-minato-linux-x64.tar.gz -C "$RUNNER_TEMP/minato-ip-src"
          PKGROOT="$RUNNER_TEMP/minato-ip-src/dsh-minato-linux-x64"
          # 数据根前后快照（名字 + mtime ✓ 排序后逐字比对 ✓）
          snap() {
            if [ -d "$HOME/.dsh" ]; then
              ( cd "$HOME/.dsh" && find . -mindepth 1 -printf '%P|%T@|%s\n' | LC_ALL=C sort )
            else
              echo "(absent)"
            fi
          }
          snap > "$RUNNER_TEMP/dsh-before.txt"
          echo "--- ~/.dsh before install --- ($(wc -l < "$RUNNER_TEMP/dsh-before.txt") line(s))"
          cat "$RUNNER_TEMP/dsh-before.txt"
          echo "--- install ---"
          bash "$PKGROOT/install.sh" --prefix "$RUNNER_TEMP/minato-ip"
          echo "install exit=$?"
          [ -x "$RUNNER_TEMP/minato-ip/dsh-minato" ] || { echo "install did not land dsh-minato"; exit 1; }
          [ -L "$HOME/.local/bin/dsh-minato" ] || { echo "install did not write the command link"; exit 1; }
          echo "--- uninstall ---"
          bash "$PKGROOT/install.sh" --uninstall --prefix "$RUNNER_TEMP/minato-ip"
          echo "uninstall exit=$?"
          [ -e "$RUNNER_TEMP/minato-ip" ] && { echo "uninstall left the prefix behind"; exit 1; }
          snap > "$RUNNER_TEMP/dsh-after.txt"
          if ! diff -u "$RUNNER_TEMP/dsh-before.txt" "$RUNNER_TEMP/dsh-after.txt"; then
            echo "~/.dsh changed across install+uninstall (the installer promised not to touch it)"
            exit 1
          fi
          echo "OK: install.sh install + uninstall both exited 0 and left ~/.dsh untouched"
      - name: Attest Linux build provenance (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0, same pinned SHA as the Windows step
        with:
          subject-path: |
            dsh-minato-linux-x64.tar.gz
            dsh-minato-linux-x64.tar.gz.sha256
      # ★★★ 发版修复（2026-10-01 打 v3.0.0-preview.1 时 CI 红）：
      #   ✗ 原来这个 job **直接上传资产** ✗ 而 draft release 是 `build` job 创建的 ✗
      #     → 而 `build` **等** `v3-linux`（needs: [test, v3-linux]）✗
      #     → **上传时 release 还不存在** ✗✗ → `release not found` ✗
      #   ✓ 现在：上传前**幂等确保 draft release 存在** ✓✓
      #     （`gh release view` 成功就不创建 ✓ 失败才创建 ✓ 不会和 build job 抢 ✓）
      - name: Ensure the draft release exists (tags only, idempotent)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --draft --repo "${GITHUB_REPOSITORY}" \
                 --title "dsh-toolkit ${GITHUB_REF_NAME} (draft - CI attaching assets)" \
                 --notes "Assets are attached by CI; publish with: gh release edit ${GITHUB_REF_NAME} --draft=false"
      - name: Upload to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dsh-minato-linux-x64.tar.gz dsh-minato-linux-x64.tar.gz.sha256 --clobber

  build:
    needs: [test, v3-linux]   # Linux 打包/冒烟失败即拦住发布（此前 Linux 坏掉也能发）
    if: startsWith(github.ref, 'refs/tags/v2') || github.event_name == 'workflow_dispatch'   # audit: v2 build must not run on v3 tags
    runs-on: windows-latest
    permissions:
      contents: write        # 回推 hashes.txt + 上传 draft release 资产
      id-token: write        # artifact attestation（OIDC）
      attestations: write    # 发布 provenance
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2，固定 commit SHA

      - name: Verify session fixes are still in the code (mechanical audit)
        shell: pwsh
        run: pwsh -NoProfile -File v3/tests/verify_fixes.ps1 -Repo .
      - name: Build exe from source (csc, .NET Framework 4.x)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $src = @("$PWD\v2\dsh_v2.cs") + (Get-ChildItem "$PWD\v2\src" -Recurse -Filter *.cs | ForEach-Object FullName)
          & $csc /nologo /optimize+ /target:exe /win32icon:icon.ico "/out:DeepSeek Harness Toolkit.exe" $src /warn:4
          if ($LASTEXITCODE -ne 0) { throw "csc build failed" }
          Get-Item "DeepSeek Harness Toolkit.exe" | Select-Object Name,Length

      # NOTE (do not add the marker-contract gate here): compare_markers is environment-dependent. V3 resolves a
      # backup's workspace root as the grandparent of its own directory and refuses paths that look like a user
      # profile, while v2.x falls back to the data root - so the two products genuinely disagree when the
      # executable does not sit under a workspace-like tree. On a checkout whose grandparent is D:\a it reports
      # 19 of 21 and would fail this job for reasons unrelated to the product. Run it by hand from a path where
      # its grandparent looks like a workspace (the project's own checkout does), one run at a time: the gate
      # and the other gates share fixed file names in the temp folder and corrupt each other if run together.

      - name: Compile Toolkit GUI.exe (embedded logo, single file)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /optimize+ /target:winexe /win32icon:icon.ico "/win32manifest:$PWD\v2\app.manifest" /resource:logo.png "/out:Toolkit GUI.exe" "$PWD\v2\gui_v2.cs" /warn:4
          if ($LASTEXITCODE -ne 0) { throw "GUI build failed" }
          Get-Item "Toolkit GUI.exe" | Select-Object Name,Length

      - name: Compile Toolkit GUI Standalone.exe (embeds core exe)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /optimize+ /target:winexe /win32icon:icon.ico "/win32manifest:$PWD\v2\app.manifest" /resource:logo.png "/resource:DeepSeek Harness Toolkit.exe,DSHCore.exe" "/out:Toolkit GUI Standalone.exe" "$PWD\v2\gui_v2.cs" /warn:4
          if ($LASTEXITCODE -ne 0) { throw "GUI standalone build failed" }
          Get-Item "Toolkit GUI Standalone.exe" | Select-Object Name,Length

      - name: Regenerate hashes.txt from CI build
        shell: pwsh
        run: |
          $files = @('DeepSeek Harness Toolkit.exe','Toolkit GUI.exe','Toolkit GUI Standalone.exe','v2\dsh_v2.cs','v2\build_exe.cmd','icon.ico','logo.png','README.md','README_zh-CN.md','LICENSE','.github/SECURITY.md','v2\verify.ps1','v2\.dsh_launcher_root')
          $files += (Get-ChildItem v2\src -Recurse -Filter *.cs | ForEach-Object { $_.FullName.Replace((Get-Location).Path + '\','') })
          # L-2：版本号从 AssemblyVersion 动态派生（取 major.minor.build 三段），避免每次 bump 手改 hashes 头（旧版本号残留）
          $verMatch = (Select-String -Path v2\dsh_v2.cs -Pattern 'AssemblyVersion\("(\d+)\.(\d+)\.(\d+)\.\d+"' | Select-Object -First 1).Matches[0]
          $verLine = ($verMatch.Groups[1].Value + '.' + $verMatch.Groups[2].Value + '.' + $verMatch.Groups[3].Value)
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add('# SHA-256 checksum manifest - DeepSeek Harness Toolkit V' + $verLine)
          $lines.Add(('# generated by GitHub Actions CI: ' + (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss') + ' UTC'))
          $lines.Add('# the exe below is built from source by the CI pipeline (source == artifact); verify the release exe against this manifest')
          $lines.Add('')
          foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            # 清单里的名字是**发布包内**的相对路径：v2 源码在仓库里位于 v2\，但发布包里仍是平铺的
            # 清单名字必须与**发布包内**的实际条目一致：Compress-Archive 只取叶子名，
            # 所以 `.github/SECURITY.md` 在包里叫 `SECURITY.md`（原清单写成 .github/SECURITY.md → 对不上）
            $lines.Add("$h  " + ($f -replace '^v2[\\/]', '' -replace '^\.github[\\/]', ''))
          }
          [System.IO.File]::WriteAllLines((Join-Path $PWD 'v2\hashes.txt'), $lines, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content v2\hashes.txt

      - name: Sign hashes.txt (maintainer GPG key, from secrets)
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # runner is a fresh machine per job: default ~/.gnupg is fine.
          # (Do NOT point GNUPGHOME at $RUNNER_TEMP in bash — the Windows
          #  path form (D:\a\_temp) mangles backslash escapes.)
          gpg --version | head -1
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --detach-sign --armor v2/hashes.txt
          # self-check before shipping: the imported key includes the public part
          gpg --batch --verify v2/hashes.txt.asc v2/hashes.txt
          ls -l v2/hashes.txt.asc
          echo "gpg fingerprint:"

          gpg --batch --with-colons --list-keys | awk -F: '/^pub/{next} /^fpr/{print $10}'

      - name: Commit regenerated hashes.txt (only when on a branch)
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git symbolic-ref -q HEAD
          if ($LASTEXITCODE -ne 0) {
            Write-Output "detached HEAD (tag-triggered build): hashes.txt generated locally, commit skipped"
            exit 0
          }
          git add v2/hashes.txt
          git commit -m "build: regenerate hashes.txt from CI build" 2>$null
          if ($LASTEXITCODE -eq 0) {
            git push
            if ($LASTEXITCODE -ne 0) { throw "git push failed" }
            Write-Output "hashes.txt committed and pushed"
          } else {
            Write-Output "hashes.txt unchanged; nothing to commit"
          }

      - name: Add obvious entry points to the release folder
        shell: pwsh
        run: |
          # Two files a user can double-click, so nobody has to work out which of a directory of
          # seventeen items is the one to run. Generated here so they are reproducible.
          Set-Content -Path 'START-GUI.cmd' -Encoding ascii -Value @(
            '@echo off',
            'chcp 65001 >nul',
            'cd /d "%~dp0"',
            'if not exist "Toolkit GUI.exe" ( echo   [X] Toolkit GUI.exe not found. Extract the whole archive. & pause & exit /b 1 )',
            'start "" "Toolkit GUI.exe"'
          )
          Set-Content -Path 'START-CLI.cmd' -Encoding ascii -Value @(
            '@echo off',
            'chcp 65001 >nul',
            'cd /d "%~dp0"',
            'if not exist "DeepSeek Harness Toolkit.exe" ( echo   [X] DeepSeek Harness Toolkit.exe not found. Extract the whole archive. & pause & exit /b 1 )',
            '"DeepSeek Harness Toolkit.exe"',
            'pause'
          )
          Set-Content -Path 'READ-ME-FIRST.txt' -Encoding utf8 -Value @(
            'DeepSeek Harness Toolkit - which file do I run?',
            '===============================================',
            '',
            '  Graphical interface : double-click START-GUI.cmd',
            '  Command line        : double-click START-CLI.cmd',
            '',
            'Everything else in this folder supports those two, or is there so you can check the',
            'download yourself:',
            '',
            '  DeepSeek Harness Toolkit.exe    command line tool',
            '  Toolkit GUI.exe                 graphical interface',
            '  Toolkit GUI Standalone.exe      graphical interface, embeds the core exe',
            '  hashes.txt / hashes.txt.asc     checksums and their signature',
            '  verify.ps1                      verifies a download against those checksums',
            '  dsh_v2.cs, build_exe.cmd, src/  the source, if you want to build it yourself',
            '',
            'This is an unofficial third-party tool and is not affiliated with DeepSeek.'
          )
          Get-ChildItem START-GUI.cmd, START-CLI.cmd, READ-ME-FIRST.txt | ForEach-Object { $_.Name }

      # m-2a FIX (CI audit MAJOR): the step header below used to be on the SAME line as the last
      # statement of the previous step's run script, which is a PowerShell parse error and left the
      # step with two run: keys - the whole v2 build job could not run at all.
      - name: Pack upload zip (16 files)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -in @('main','master','')) { $tag = "${{ inputs.release_tag }}" }
          if ($tag -eq '') { $tag = 'dev' }
          $zipName = "DeepSeek-Harness-Toolkit_${tag}_upload-package.zip"
          $items = @('DeepSeek Harness Toolkit.exe','Toolkit GUI.exe','Toolkit GUI Standalone.exe','START-GUI.cmd','START-CLI.cmd','READ-ME-FIRST.txt','v2\dsh_v2.cs','v2\build_exe.cmd','icon.ico','logo.png','README.md','README_zh-CN.md','LICENSE','.github/SECURITY.md','v2\verify.ps1','.gitignore','v2\hashes.txt','v2\hashes.txt.asc','v2\.dsh_launcher_root','v2\src')
          Compress-Archive -Path $items -DestinationPath $zipName -CompressionLevel Optimal
          Write-Output ("zip: " + [math]::Round((Get-Item $zipName).Length/1KB,1) + " KB")

      - name: Attach release assets (tag builds only; target release must be a DRAFT)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -in @('main','master','')) { $tag = "${{ inputs.release_tag }}" }
          if ($tag -eq '') { Write-Output 'no release tag provided; skipping release upload'; exit 0 }
          # 不可变发布（immutable releases）兼容：资产只在 tag 构建时一次性附加；
          # release 不存在时自动建 DRAFT（notes 发布前定稿）；已发布则拒绝上传（冻结）。
          if ($env:GITHUB_REF_TYPE -ne 'tag') { Write-Output "non-tag run ($env:GITHUB_REF_TYPE): upload skipped (immutable-release flow)"; exit 0 }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft 2>$null
          $isDraft = $LASTEXITCODE -eq 0 ? (gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft) : 'missing'
          if ($isDraft -eq 'missing') {
            Write-Output "release '$tag' not found; creating as DRAFT (notes finalized before publish)"
            gh release create $tag --draft --repo $env:GITHUB_REPOSITORY --title "dsh-toolkit $tag (draft - CI attaching assets)" --notes "Assets are being attached by CI. Release notes will be finalized before publishing."
            if ($LASTEXITCODE -ne 0) { throw "failed to create draft release $tag" }
          } elseif ($isDraft -ne 'true') {
            Write-Output "release '$tag' is already PUBLISHED (immutable); refusing to modify its assets"
            exit 0
          }
          function Upload([string]$file, [string]$tag, [string]$repo) {
            for ($i = 1; $i -le 5; $i++) {
              gh release upload $tag $file --repo $repo --clobber
              if ($LASTEXITCODE -eq 0) { return }
              Write-Output "upload retry $i (transient GitHub 5xx) for $file"
              Start-Sleep -Seconds 5
            }
            throw "upload failed after retries: $file"
          }
          Upload "DeepSeek Harness Toolkit.exe" $tag $env:GITHUB_REPOSITORY
          Upload "Toolkit GUI.exe" $tag $env:GITHUB_REPOSITORY
          Upload "Toolkit GUI Standalone.exe" $tag $env:GITHUB_REPOSITORY
          Upload "v2\hashes.txt" $tag $env:GITHUB_REPOSITORY
          Upload "v2\hashes.txt.asc" $tag $env:GITHUB_REPOSITORY
          $assets = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          # 改名迁移安全网：只清理核心 exe 的历史命名残留（DeepSeek.Harness.Toolkit.<版本>.exe 等），
          # 保留 Toolkit.GUI.exe 等其他合法资产（GUI 面板是与核心并列的独立发布物）
          $oldExes = $assets | Where-Object { $_ -match '^DeepSeek\.Harness\.Toolkit(\..+)?\.exe$' -and $_ -ne 'DeepSeek.Harness.Toolkit.exe' }
          foreach ($oe in $oldExes) { gh release delete-asset $tag $oe --repo $env:GITHUB_REPOSITORY }
          $zipName = "DeepSeek-Harness-Toolkit_${tag}_upload-package.zip"
          Upload $zipName $tag $env:GITHUB_REPOSITORY
          Write-Output "assets attached to release $tag (publish with: gh release edit $tag --draft=false)"

      - name: Attest build provenance (tag builds only)
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0，固定 commit SHA
        with:
          subject-path: |
            DeepSeek Harness Toolkit.exe
            Toolkit GUI.exe
            Toolkit GUI Standalone.exe
            v2/hashes.txt
            v2/hashes.txt.asc
            DeepSeek-Harness-Toolkit_*_upload-package.zip
  # ---------------------------------------------------------------------------
  # V3 Windows package. Mirrors the v3-linux job: same three shapes, same
  # launcher entries, same isolated smoke test. The classic v2.x Windows zip is
  # produced by the `build` job above and is unchanged by this.
  #
  # Two details worth keeping: the zip is written through ZipArchive with
  # forward-slash entry names, because Compress-Archive on Windows writes
  # backslashes and those break extraction on Linux, macOS and WSL; and the
  # smoke test runs against an isolated DSH_HOME so it never touches real data.
  # ---------------------------------------------------------------------------
  v3-windows:
    name: V3 Windows package (win-x64)
    needs: v3-contracts
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/v3-linux'
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write        # artifact attestation (OIDC)
      attestations: write    # release provenance
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 fixed SHA
      - name: Publish V3 CLI (self-contained single file)
        run: dotnet publish v3/src/Dsht.Cli/Dsht.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o out/sc --nologo
      - name: Publish V3 CLI (small, framework-dependent)
        run: dotnet publish v3/src/Dsht.Cli/Dsht.Cli.csproj -c Release -r win-x64 --self-contained false -o out/fd --nologo
      - name: Publish Avalonia GUI (self-contained)
        run: dotnet publish v3/gui/Dsht.Gui.Avalonia/Dsht.Gui.Avalonia.csproj -c Release -r win-x64 --self-contained true -o out/gui --nologo
      - name: Smoke test the published CLI (isolated root, never the default port)
        shell: pwsh
        run: |
          $iso = Join-Path $env:RUNNER_TEMP "smoke-iso"
          New-Item -ItemType Directory -Path (Join-Path $iso "storages") -Force | Out-Null
          Set-Content -Path (Join-Path $iso "storages/smoke.txt") -Value "smoke" -Encoding UTF8
          $env:DSH_HOME = $iso
          $exe = "out/sc/dsh-minato.exe"
          & $exe version
          if ($LASTEXITCODE -ne 0) { throw "version failed" }
          & $exe about
          # 第一次备份必须显式给目录（D4 契约 ✓）→ 用隔离根里的一个目录 ✓
          $bk = Join-Path $iso "backups"
          New-Item -ItemType Directory -Path $bk -Force | Out-Null
          $p = (& $exe backup --to $bk 2>&1 | Select-String "BACKUP_OK" | Select-Object -First 1)
          if (-not $p) { throw "backup did not report BACKUP_OK" }
          $v = (& $exe backup-list --verify 2>&1 | Select-String "complete" | Select-Object -First 1)
          if (-not $v) { throw "verify did not report a complete package" }
          Write-Output "smoke ok: $p"
      - name: Assemble the Windows package
        shell: pwsh
        run: |
          $pkg = "dsh-minato-win-x64"
          Remove-Item $pkg -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "$pkg/cli-small", "$pkg/gui", "$pkg/icons" -Force | Out-Null
          Copy-Item out/sc/dsh-minato.exe "$pkg/dsh-minato.exe"
          Copy-Item out/fd/* "$pkg/cli-small/" -Recurse
          Copy-Item out/gui/* "$pkg/gui/" -Recurse
          Copy-Item v3/gui/Dsht.Gui.Avalonia/Assets/logo-icon.png "$pkg/icons/dsh-minato.png"
          Copy-Item LICENSE "$pkg/" -ErrorAction SilentlyContinue
          Copy-Item README.md "$pkg/" -ErrorAction SilentlyContinue
          # Two obvious entry points at the root, so a user does not have to pick a file out of a list.
          Set-Content -Path "$pkg/START-GUI.cmd" -Encoding ascii -Value @(
            "@echo off",
            "chcp 65001 >nul",
            "cd /d `"%~dp0`"",
            "if not exist `"gui\dsht-gui.exe`" ( echo   [X] gui\dsht-gui.exe not found. Extract the whole archive. & pause & exit /b 1 )",
            "start `"`" `"gui\dsht-gui.exe`""
          )
          Set-Content -Path "$pkg/START-CLI.cmd" -Encoding ascii -Value @(
            "@echo off",
            "chcp 65001 >nul",
            "cd /d `"%~dp0`"",
            "if not exist `"dsh-minato.exe`" ( echo   [X] dsh-minato.exe not found. Extract the whole archive. & pause & exit /b 1 )",
            "`"dsh-minato.exe`"",
            "pause"
          )
          Set-Content -Path "$pkg/READ-ME-FIRST.txt" -Encoding utf8 -Value @(
            "dsh-minato 3.0 (V3) - Windows package",
            "=====================================",
            "",
            "  Graphical interface : double-click START-GUI.cmd",
            "  Command line        : double-click START-CLI.cmd",
            "",
            "Everything else in this folder is used by those two.",
            "",
            "  dsh-minato.exe   command line tool, self-contained, no .NET needed",
            "  cli-small/       same tool, smaller, needs the .NET 8 runtime",
            "  gui/dsht-gui.exe graphical interface, self-contained",
            "  icons/           icon for shortcuts",
            "",
            "Safety: without DSH_HOME set it operates on your default dsh data directory.",
            "To try it safely first:  set DSH_HOME=D:\tmp\dsh-test",
            "A restore always makes a pre-restore backup first and prints where it went.",
            "Backups can prove their own completeness:  dsh-minato.exe backup-list --verify",
            "",
            "Version shows 3.0.0-dev until a release tag is cut."
          )
          # ★★★ **N-15 修复（安装器复审 MAJOR —— 便携 zip 从来不带插件）** ✓✓
          #   ✗ 这个 Assemble 步骤**先**打好 `$pkg.zip` ✗ 而 `plugin/` 是**之后**的
          #     `build_installer.ps1` 才拷进同一个目录的（为了给安装器做载荷 ✓）
          #     → **zip 里没有 `plugin/`** ✗✗ → 用户从 zip 装的那份
          #       `bridge-install` **永远报 `BRIDGE_NO_PLUGIN`** ✓
          #     （实测：桌面上的 `dsh-minato-win-x64.zip` 242 条目 · **0 个 plugin** ✓）
          #   ✓ 现在：**打包前先把插件拷进 `$pkg`** ✓✓（和安装器载荷用同一份源码 ✓）
          $repoRootZip = (Resolve-Path (Join-Path $PWD "..")).Path
          $pluginSrcZip = Join-Path $repoRootZip "plugin\dsh-minato-bridge"
          if (Test-Path $pluginSrcZip) {
            $pluginDstZip = Join-Path $pkg "plugin\dsh-minato-bridge"
            New-Item -ItemType Directory -Path $pluginDstZip -Force | Out-Null
            Copy-Item (Join-Path $pluginSrcZip "*") $pluginDstZip -Recurse -Force
            $pnZip = @(Get-ChildItem $pluginDstZip -Recurse -File).Count
            Write-Output ("  bridge plugin in the zip: " + $pnZip + " files")
          } else { Write-Output ("  ! plugin source not found: " + $pluginSrcZip) }
          # ✓✓ **M9 修复（审计 MAJOR）**：**zip 里必须带 hashes.txt** ✓✓
          #   ✗ 上面 `Remove-Item $pkg -Recurse -Force` 会**连构建脚本刚写的清单一起删掉** ✗
          #     → 这个 zip 里**没有清单** ✗ → `launcher.cs` 的
          #       `if (!File.Exists(manifest)) return null;` → **反篡改校验完全失效** ✗✗
          #     → 用户从 zip 装的那份**被改了也不会拒绝启动** ✓（与安装器装的那份行为不一致 ✗）
          #   ✓ 现在：**打包前重新生成一份** ✓✓
          #     · 相对路径 + 反斜杠 ✓（与启动器 `FindHashExact` 的查找方式一致 ✓✓）
          #     · 排除清单自身 ✓（与构建脚本同一规则 ✓）
          $pkgFull = (Resolve-Path $pkg).Path.TrimEnd('\')
          $mfiles = @(Get-ChildItem $pkg -Recurse -File | Where-Object { $_.Name -ne 'hashes.txt' } | Sort-Object FullName)
          $mlines = @()
          foreach ($mf in $mfiles) { $mlines += ((Get-FileHash $mf.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $mf.FullName.Substring($pkgFull.Length).TrimStart('\')) }
          [System.IO.File]::WriteAllLines((Join-Path $pkgFull 'hashes.txt'), $mlines, (New-Object System.Text.UTF8Encoding($false)))
          Write-Output ("payload manifest: " + $mlines.Count + " files")

          # Zip with forward-slash entry names: Compress-Archive writes backslashes on Windows,
          # and those break extraction on Linux, macOS and WSL.
          $zip = "$pkg.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $fs = [System.IO.File]::Open((Join-Path (Get-Location) $zip), [System.IO.FileMode]::CreateNew)
          $arch = New-Object System.IO.Compression.ZipArchive($fs, [System.IO.Compression.ZipArchiveMode]::Create)
          $root = (Resolve-Path $pkg).Path
          foreach ($f in (Get-ChildItem $root -Recurse -File | Sort-Object FullName)) {
            $rel = $f.FullName.Substring($root.Length + 1).Replace('\','/')
            $e = $arch.CreateEntry("$pkg/$rel", [System.IO.Compression.CompressionLevel]::Optimal)
            $es = $e.Open(); $src = [System.IO.File]::OpenRead($f.FullName); $src.CopyTo($es); $src.Close(); $es.Close()
          }
          $arch.Dispose(); $fs.Close()
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$zip.sha256" -Value "$h  $zip" -Encoding ascii
          Get-Content "$zip.sha256"

      # ★ 体积裁剪（PublishTrimmed）的失败**只在运行时暴露** ✗ —— 构建通过 ≠ 能跑 ✓
      #   所以这里真的把**打包后的** GUI 启动一次（旁边就有 CLI，最接近用户拿到的那份）：
      #     ① 进程活过 10 秒   ② 而且**真的创建了窗口**（MainWindowHandle ≠ 0）
      #   裁剪最常见的事故是"启动即崩 / 窗口建不起来"，这两条都能抓到 ✓✓
      #   （此前**没有任何 job 会启动 GUI** ✗ —— verify-linux.sh 只检查 `gui/dsht-gui` 存在 ✓）
      - name: Smoke test the packaged GUI opens a window (trim safety)
        shell: pwsh
        run: |
          $guiDir = "dsh-minato-win-x64/gui"
          $exe = Join-Path $guiDir "dsht-gui.exe"
          if (-not (Test-Path $exe)) { throw "GUI exe missing in the package: $exe" }
          # 隔离数据根：绝不碰真实 ~/.dsh
          $env:DSH_HOME = Join-Path $env:RUNNER_TEMP "gui-smoke"
          New-Item -ItemType Directory -Path $env:DSH_HOME -Force | Out-Null
          $p = Start-Process -FilePath (Resolve-Path $exe).Path -WorkingDirectory (Resolve-Path $guiDir).Path -PassThru
          Start-Sleep -Seconds 10
          $p.Refresh()
          if ($p.HasExited) {
            throw ("GUI exited within 10s (exit code " + $p.ExitCode + ") - trimming probably removed something it needs at runtime")
          }
          if ($p.MainWindowHandle -eq 0) {
            Stop-Process -Id $p.Id -Force
            throw "GUI process is alive but never created a window (trimming or a missing dependency)"
          }
          Stop-Process -Id $p.Id -Force
          Write-Output ("GUI smoke ok: window created, stayed alive 10s (pid " + $p.Id + ")")
      - name: Build the self-extracting installer (win-x64)
        shell: pwsh
        run: |
          # 自解压安装器 ✓✓（**必须进 CI** ✗ 否则发版产物里没有它 ✓ 用户拿不到"双击即装" ✓）
          # build_installer.ps1 自己探测 Roslyn ✓（windows runner 自带 VS2022 ✓）
          # m-2b FIX (CI audit MAJOR): on workflow_dispatch from a branch, ref_name is the BRANCH
          # ("main" / "v3-linux"), and build_installer.ps1 rejects a version that is not numeric
          # dotted - so the windows job could only ever succeed on a tag. Normalise the same way
          # the packaging steps above already do.
          $vtag = "${{ github.ref_name }}"
          if ($vtag -in @('main','master','')) { $vtag = "${{ inputs.release_tag }}" }
          if ($vtag -eq '') { $vtag = '3.0.0' }
          # N-14 FIX (installer audit MAJOR): every real tag is v-prefixed, and this pattern
          # rejected all of them - so a v3.1.0 tag silently built 3.0.0, while the upload step
          # asked for the v-prefixed name and could not find it. Strip the prefix first.
          $vtag = $vtag.TrimStart('v', 'V')
          # ★★★ **发版修复（2026-10-01）—— 必须认「预发布后缀」** ✓✓
          #   ✗ 原来 `^\d+(\.\d+){1,3}$` ✗ → `3.0.0-preview.1` / `-rc.1` / `-beta.2` **全不匹配** ✗
          #     → **静默换成 `3.0.0`** ✗✗ → 打 `v3.0.0-preview.1` 会产出标着 `3.0.0` 的安装器 ✗
          #     → 而 **CLI 自报 `3.0.0-preview.1`** ✗ → **产物与二进制版本对不上** ✗（预发布版最容易被坑 ✓）
          #   ✓ 现在：**数字点分 + 可选的预发布后缀** ✓✓（`3.0.0` ✓ `3.0.0-preview.1` ✓ `3.0.0-rc.2` ✓）
          #     · 仍然拒绝分支名/乱码 ✓（不匹配才回落 `3.0.0` ✓）
          if ($vtag -notmatch '^\d+(\.\d+){1,3}(-[0-9A-Za-z][0-9A-Za-z.\-]*)?$') { $vtag = '3.0.0' }   # branch or non-tag ref -> dev version
          Write-Output "installer version: $vtag (ref: ${{ github.ref_name }})"
          pwsh -File v3/tools/build_installer.ps1 -PayloadDir "dsh-minato-win-x64" -Version "$vtag" -Out "dsh-minato-$vtag-win-x64-setup.exe"
          $setup = "dsh-minato-$vtag-win-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "安装器没有生成 ✗" }
          # m-2c FIX (CI audit MAJOR): this step only checked that a file existed and hashed it,
          # which is why the bug where the uninstaller deleted NOTHING reached users - nothing
          # here ever ran the installer. Install silently into a scratch folder, confirm the
          # payload and the marker landed, then uninstall and confirm our own files are gone.
          $smoke = Join-Path $env:TEMP ("dsht-smoke-" + [guid]::NewGuid().ToString("N").Substring(0,8))
          Write-Output "smoke: installing into $smoke"
          # N-13 FIX (installer audit MAJOR): `& $exe` on a GUI executable does not wait under
          # Windows PowerShell and leaves $LASTEXITCODE unset, so this threw immediately - and
          # the checks below never asserted the uninstall exit code at all. Start-Process waits
          # and gives a real exit code.
          $sp = Start-Process -FilePath $setup -ArgumentList "--silent", "--dir=$smoke" -Wait -PassThru
          if ($sp.ExitCode -ne 0) { throw "smoke: the installer exited $($sp.ExitCode)" }
          if (-not (Test-Path (Join-Path $smoke "dsh-minato.exe"))) { throw "smoke: dsh-minato.exe is missing" }
          if (-not (Test-Path (Join-Path $smoke ".dsh-minato-install"))) { throw "smoke: the install marker is missing" }
          $smokeUninst = Join-Path $smoke "uninstall.exe"
          if (-not (Test-Path $smokeUninst)) { throw "smoke: uninstall.exe is missing" }
          $spu = Start-Process -FilePath $smokeUninst -ArgumentList "--uninstall", "--silent" -Wait -PassThru
          $rc = $spu.ExitCode
          Write-Output "smoke: the uninstaller exited $rc"
          if ($rc -ne 0) { throw "smoke: the uninstaller exited $rc" }   # N-13 FIX: was printed, never asserted
          if (Test-Path (Join-Path $smoke "dsh-minato.exe")) { throw "smoke: the uninstaller left dsh-minato.exe behind - the exact bug that shipped once" }
          if (Test-Path (Join-Path $smoke "gui")) { throw "smoke: the uninstaller left the gui folder behind" }
          if (Test-Path (Join-Path $smoke ".dsh-minato-install")) { throw "smoke: the uninstaller left the install marker behind" }
          if (Test-Path (Join-Path $smoke "plugin")) { throw "smoke: the uninstaller left the plugin folder behind" }
          $arp = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\dsh-minato" -ErrorAction SilentlyContinue
          if ($null -ne $arp) { throw "smoke: the registry entry survived the uninstall" }   # N-13 FIX: the audit found this in 4 of 8 runs
          Write-Output "smoke: OK - install and uninstall both did what they should"
          Remove-Item $smoke -Recurse -Force -ErrorAction SilentlyContinue
          $h = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$h  $setup" | Set-Content -Path "$setup.sha256" -Encoding ascii
          "安装器 $([Math]::Round((Get-Item $setup).Length/1MB,1)) MB · sha256 $($h.Substring(0,16))…"

      - name: Attest Windows V3 build provenance (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0, same pinned SHA as the other steps
        with:
          subject-path: |
            dsh-minato-win-x64.zip
            dsh-minato-win-x64.zip.sha256
      - name: Upload to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # ★★★ 发版修复（2026-10-01 打 v3.0.0-preview.1 时 CI 红）：
          #   ✗ 这里用了 `$vtag` ✗ 但它在**另一个 step** 里算的 ✗
          #     → **每个 step 是独立 shell** ✗ → 这里 `$vtag` 是**空的** ✗✗
          #     → 去找 `dsh-minato--win-x64-setup.exe`（双横线 ✓ 空版本号 ✗）→ 找不到 ✗
          #   ✓ 现在：**在本 step 里重算** ✓✓（与上面 step 同一套规则 ✓）
          $vtag = $tag.TrimStart('v', 'V')
          if ($vtag -notmatch '^\d+(\.\d+){1,3}(-[0-9A-Za-z][0-9A-Za-z.\-]*)?$') { $vtag = '3.0.0' }
          Write-Output "upload version: $vtag (ref: $tag)"
          # ★★★ 同上：release 可能还没被 build job 创建 ✗ → **幂等确保存在** ✓✓
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --repo "$env:GITHUB_REPOSITORY" --title "dsh-toolkit $tag (draft - CI attaching assets)" --notes "Assets are attached by CI; publish with: gh release edit $tag --draft=false"
          }
          gh release upload $tag dsh-minato-win-x64.zip dsh-minato-win-x64.zip.sha256 --clobber
          gh release upload $tag "dsh-minato-$vtag-win-x64-setup.exe" "dsh-minato-$vtag-win-x64-setup.exe.sha256" --clobber   # N-14 FIX: use the normalised version, not the raw ref
