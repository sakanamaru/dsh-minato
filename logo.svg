<?xml version="1.0" encoding="UTF-8"?>
<!--
  dsh-minato logo — harbor anchor mark (港 / 锚).

  Hand-written vector source. Pure geometry: no text, no fonts, no external
  assets, no embedded raster. Two colours only:
      #0B2545  navy   — keyline (描边), keeps the mark readable on light ground
      #2BB3A3  teal   — brand silhouette, keeps it readable on dark ground

  Geometry is authored in a 512-unit design space and scaled to fill the canvas
  (scale 1.16 about (256, 254.5), re-centred) by the group below.

  Two layers, in this order:
    1. keyline layer = the silhouette dilated by 6 units (drawn in navy)
    2. silhouette    = drawn in teal on top
  The anchor ring is a real annulus (a stroked circle) in both layers, so the
  ring hole is genuinely transparent — nothing is hidden behind it.

  Raster twin: logo.png / logo-128.png / logo-64.png were generated from the
  very same numbers with Pillow (see docs/ASSETS.md for the reproduction steps).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">dsh-minato logo</title>

  <g transform="translate(256 256) scale(1.16) translate(-256 -254.5)">

    <!-- 1. keyline layer: silhouette dilated by 6 -->
    <g fill="#0B2545">
      <circle cx="256" cy="140" r="50" fill="none" stroke="#0B2545" stroke-width="44"/>
      <rect x="114" y="190" width="284" height="56" rx="28"/>
      <rect x="224" y="168" width="64" height="238"/>
      <path d="M113.733 304.794A148 148 0 0 0 398.267 304.794"
            fill="none" stroke="#0B2545" stroke-width="58" stroke-linecap="round"/>
      <circle cx="113.733" cy="304.794" r="29"/>
      <circle cx="398.267" cy="304.794" r="29"/>
      <path d="M430.950 314.166L365.584 295.423L432.382 265.549Z"/>
      <path d="M81.050 314.166L146.416 295.423L79.618 265.549Z"/>
    </g>

    <!-- 2. brand silhouette -->
    <g fill="#2BB3A3">
      <circle cx="256" cy="140" r="50" fill="none" stroke="#2BB3A3" stroke-width="32"/>
      <rect x="120" y="196" width="272" height="44" rx="22"/>
      <rect x="230" y="174" width="52" height="226"/>
      <path d="M113.733 304.794A148 148 0 0 0 398.267 304.794"
            fill="none" stroke="#2BB3A3" stroke-width="46" stroke-linecap="round"/>
      <circle cx="113.733" cy="304.794" r="23"/>
      <circle cx="398.267" cy="304.794" r="23"/>
      <path d="M425.182 312.512L371.351 297.076L428.445 270.078Z"/>
      <path d="M86.818 312.512L140.649 297.076L83.555 270.078Z"/>
    </g>

  </g>
</svg>
